<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미소주유소 로그인</title>
<style>
  :root { --bg: #f1f5f9; --card: #fff; --text: #0f172a; --muted: #64748b; --primary: #2563eb; --err: #dc2626; --line: #cbd5e1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --primary: #3b82f6; --err: #f87171; --line: #334155; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: var(--bg); color: var(--text); font-family: 'Malgun Gothic', -apple-system, sans-serif; }
  .box { width: 100%; max-width: 360px; background: var(--card); border-radius: 12px; padding: 28px 24px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); }
  button { width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  #msg { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
  <form class="box" id="f">
    <h1>⛽ 미소주유소 자동화</h1>
    <p>외부에서 접속하려면 비밀번호를 입력하세요.</p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
    <button type="submit" id="btn">로그인</button>
    <div id="msg"></div>
  </form>
<script>
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('btn'), msg = document.getElementById('msg');
    btn.disabled = true; msg.textContent = '';
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }) });
      const j = await r.json();
      if (j.ok) { location.href = '/'; return; }
      msg.textContent = j.error || '로그인 실패';
    } catch (_) { msg.textContent = '서버에 연결할 수 없습니다. 주유소 PC가 켜져 있는지 확인하세요.'; }
    btn.disabled = false;
  });
</script>
</body>
</html>
