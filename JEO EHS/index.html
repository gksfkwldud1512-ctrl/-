<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEO EH&amp;S 관리시스템</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b6b"/>
      <stop offset="17%" stop-color="#ff9a3b"/>
      <stop offset="34%" stop-color="#ffe23b"/>
      <stop offset="50%" stop-color="#3bff8f"/>
      <stop offset="67%" stop-color="#3bd4ff"/>
      <stop offset="84%" stop-color="#a13bff"/>
      <stop offset="100%" stop-color="#ff3b6b"/>
    </linearGradient>
  </defs>
</svg>

<header class="topbar">
  <button class="hamburger" id="hamburgerBtn" aria-label="메뉴 열기/닫기">
    <span></span><span></span><span></span>
  </button>
  <div class="topbar-logo" id="homeLink">
    <img src="assets/logo.png" alt="Johnson Electric" class="topbar-logo-img">
  </div>
  <h1 class="topbar-title">JEO EH&amp;S 관리시스템</h1>
  <div class="topbar-spacer"></div>
</header>

<div class="app-body">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-pin">
      <button class="sidebar-pin-btn" id="overviewNavBtn">🗺 종합화면</button>
    </div>
    <ul class="menu" id="menu"></ul>
  </nav>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="content" id="content">
    <section class="home-view" id="homeView">
      <h2>JEO EH&amp;S 통합 관리 시스템</h2>
      <p class="home-sub">안전(Safety) · 보건(Health) · 환경(Environment) 관련 자동화 시스템을 한 곳에서 확인하세요.</p>
      <div class="home-grid" id="homeGrid"></div>
    </section>
    <section class="overview-view hidden" id="overviewView">
      <div class="overview-view-inner">
        <h2>종합화면</h2>
        <p class="overview-sub">세부 항목을 누르면 입력→처리→출력 로직을 볼 수 있습니다.</p>
        <div class="overview-layout">
          <div class="org-tree">
            <div class="org-apex">
              <img src="assets/logo.png" class="org-apex-logo" alt="">
              <span>JEO EH&amp;S</span>
            </div>
            <div class="org-trunk-h" aria-hidden="true">
              <span class="org-trunk-up org-line-v"></span>
              <span class="org-trunk-bar org-line-h"></span>
              <span class="org-drop org-drop--1 org-line-v"></span>
              <span class="org-drop org-drop--2 org-line-v"></span>
              <span class="org-drop org-drop--3 org-line-v"></span>
            </div>
            <div class="org-categories" id="orgCategories"></div>
          </div>
          <div class="org-side">
            <div class="org-side-label">독립 운영 항목</div>
            <div class="org-side-categories" id="orgSideCategories"></div>
          </div>
        </div>
      </div>
    </section>
    <iframe class="app-frame" id="appFrame" title="EHS 하위 시스템"></iframe>
  </main>
</div>

<script src="js/menu-data.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
